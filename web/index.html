<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <h1>Task Manager</h1>

        <!-- Форма добавления задачи -->
        <form id="task-form" class="card">
            <input type="text" id="title" placeholder="Что нужно сделать?" required>
            <div class="row">
                <input type="date" id="deadline">
                <select id="priority">
                    <option value="1">Низкий</option>
                    <option value="2" selected>Средний</option>
                    <option value="3">Высокий</option>
                </select>
            </div>
            <input type="text" id="tags" placeholder="Теги через пробел">
            <button type="submit">Добавить</button>
            <p id="error" class="error"></p>
        </form>

        <!-- Поиск, сортировка и фильтры -->
        <div class="card toolbar">
            <input type="text" id="search" placeholder="Поиск...">
            <select id="sort">
                <option value="">Без сортировки</option>
                <option value="deadline">По дедлайну</option>
                <option value="priority">По приоритету</option>
            </select>
            <label><input type="checkbox" id="overdue"> Просроченные</label>
            <a href="/api/export/csv" class="link">Скачать CSV</a>
        </div>

        <p id="tag-filter" class="tag-filter hidden">
            Тег: <span id="tag-name"></span>
            <button type="button" id="clear-tag" class="small">✕</button>
        </p>

        <!-- Список задач заполняет js/app.js -->
        <ul id="task-list" class="task-list"></ul>
        <p id="empty" class="empty hidden">Задач нет</p>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
